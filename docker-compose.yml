services:
  postgres:
    image: postgres:16
    container_name: bima-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: BIMA
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ngala
    ports:
      - "5432:5432"
    volumes:
      - bima-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BIMA"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bima-postgres-data:
